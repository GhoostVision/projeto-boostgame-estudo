<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />

    <title>Estudo</title>
  </head>

  <body>
    <header class="container-fluid">
      <div class="row g-1">
        <div class="col-3 box-titulo-principal">
          <i class="bi bi-rocket"></i>
          <h1>BOOSTGAME</h1>
        </div>
        <ul class="col-5 box-navegacao-text">
          <l1><a href="">INICIO</a></l1>
          <l1><a href="">LANCAMENTOS</a></l1>
          <l1><a href="">PROMONCOES</a></l1>
        </ul>
        <div class="col-4 box-navegacao-icons">
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button
              class="btn btn-outline-success btn-pesquisa-nav"
              type="submit"
            >
              <i class="bi bi-search"></i>
            </button>
          </form>
          <a href=""><i class="bi bi-person icons-nav"></i></a>
          <a href=""><i class="bi bi-cart icons-nav"></i></a>
          <a href=""><i class="bi bi-suit-heart icons-nav"></i></a>
        </div>
      </div>
    </header>

    <main>
      <section class="container-fluid promocoes-home">
        <div
          id="carouselExampleInterval"
          class="carousel slide"
          data-bs-ride="carousel
          carousel-box"
        >
          <div class="carousel-inner carousel-box-slide">
            <div class="carousel-item active" data-bs-interval="10000">
              <img
                src="../projectzomboid.jpg"
                class="d-block w-100 imagem-carousel"
                alt="..."
              />
            </div>
            <div class="carousel-item" data-bs-interval="2000">
              <img src="../gta5.jpg" class="d-block w-100 imagem-carousel" alt="..." />
            </div>
            <div class="carousel-item">
              <img src="../cyberpunk.jpg" class="d-block w-100 imagem-carousel" alt="..." />
            </div>
          </div>
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleInterval"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleInterval"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </section>
    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
